<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link rel="stylesheet" href="public/styles/main.css">
    <link rel="stylesheet" href="public/styles/pages/register.css">
  </head>
  <body>
    <div class="background-decor">
    <img src="./public/icon/planta.svg" class="svg-leaf" style="top: 10%; left: 5%; width: 120px;">
    <img src="./public/icon/planta.svg" class="svg-leaf" style="bottom: 15%; right: 8%; width: 140px;">
    <img src="./public/icon/planta.svg" class="svg-leaf" style="top: 40%; right: 50%; width: 100px;">
  </div>
    <div class="wrap">
      <div class="left">
        <div class="brand">
          <h2>Bienvenido</h2>
          <p>Únete a nuestra comunidad y empieza a explorar.</p>
        <img src="./public/img/img1.png" alt="Ilustración" class="welcome-img">
        </div>
      </div>

      <div class="right">
        <div class="card">
          <header>
            <div class="logo">
              <img src="./public/icon/planta.svg" alt="Logo Chinampa" style="width: 60px; height: 60px;">
    
            </div>
            <div>
              <h1>Crear cuenta</h1>
              <p class="lead">Completa los campos para registrarte</p>
            </div>
          </header>

          <form id="registerForm">
            <div>
              <label for="name">Nombre completo</label>
              <input type="text" id="name" class="input" required />
            </div>

            <div>
              <label for="email">Correo electrónico</label>
              <input type="email" id="email" class="input" required />
            </div>

            <div class="pwd-wrap">
              <label for="password">Contraseña</label>
              <input type="password" id="password" class="input" required />
              <button
                class="pwd-toggle"
                type="button"
                onclick="togglePassword()"
              >
                <img src="./public/icon/eye.svg" alt="Mostrar" />
              </button>
            </div>
            <div>
              <label for="role">Tipo de usuario</label>
              <select id="role" class="input" required>
                <option value="farmer">Agricultor</option>
                <option value="buyer">Comprador</option>
                <option value="scientist">Científico</option>
              </select>
            </div>

            <div class="row">
              <div class="checkbox">
                <input type="checkbox" id="terms" required />
                <label for="terms">Acepto los términos</label>
              </div>
            </div>

            <button type="submit" class="btn">Registrarme</button>
          </form>

          <div class="helper" style="margin-top: 6px">
            <span class="small">¿Ya tienes cuenta?</span>
            <a class="small" href="./login.html">Inicia sesión</a>
          </div>

          <footer>
            <span>© 2025</span>
            <span>Chinampa</span>
          </footer>
        </div>
      </div>
    </div>

    <script src="./js/register.js"></script>
    <script>
      function togglePassword() {
        const pwd = document.getElementById("password");
        pwd.type = pwd.type === "password" ? "text" : "password";
      }

    </script>
  </body>
</html>
